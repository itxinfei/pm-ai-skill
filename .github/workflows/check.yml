name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 结构自检
        run: node scripts/check.js

      - name: 基线门禁
        run: node bin/index.js score all evals/baseline/claude --baseline evals/baseline/claude/score.json --strict

      - name: CLI 可用性
        run: |
          node bin/index.js info
          node bin/index.js template
          node bin/index.js doc
          node bin/index.js example
          node bin/index.js asset
          node bin/index.js eval

      - name: 安装脚本语法
        run: bash -n install.sh

      - name: 打包体积
        run: npm pack --dry-run 2>&1 | tail -5
